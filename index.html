<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CondoCheck V2</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a2c35; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .screen { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: none; position: relative; }
        .active { display: block; }
        h2, h3 { text-align: center; color: #1a2c35; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; background: #f9f9f9; }
        .btn-main { width: 100%; padding: 15px; background: #1a2c35; color: #00d2b4; border: none; font-weight: bold; font-size: 16px; margin-top: 20px; border-radius: 8px; cursor: pointer; }
        .btn-main:disabled { background: #555; cursor: not-allowed; }
        .btn-extra { background: #1a2c35; color: white; border: 2px dashed #00d2b4; margin-top: 30px; }
        .error { color: red; text-align: center; margin-top: 10px; font-weight: bold; }
        .progress-container { width: 100%; background-color: #ddd; border-radius: 8px; margin-top: 15px; overflow: hidden; height: 10px; }
        .progress-bar { height: 10px; background-color: #00d2b4; width: 0%; transition: width 0.3s; }
        .logo-arca { position: fixed; bottom: 20px; left: 20px; width: 60px; height: auto; opacity: 0.6; z-index: 100; transition: opacity 0.3s; }
        .logo-condocheck { width: 160px; height: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); display: block; margin: 0 auto 10px auto; }
        .task-card { background: #f0f8f7; padding: 15px; margin-top: 15px; border-radius: 8px; border-left: 5px solid #00d2b4; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .task-title { font-size: 16px; color: #333; font-weight: bold; margin-bottom: 15px; line-height: 1.3; }
        .btn-group { display: flex; gap: 10px; }
        .btn-executar, .btn-justificar { flex: 1; padding: 12px; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-executar { background: #00d2b4; }
        .btn-justificar { background: #ff9800; }
        .execucao-box, .justificativa-box { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; display: none; }
        .execucao-box.open, .justificativa-box.open { display: block; }
        .btn-send-exec, .btn-send-just { width: 100%; padding: 12px; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-send-exec { background: #00d2b4; }
        .btn-send-just { background: #1a2c35; }
        .task-done { background: #e8f5e9; border-left-color: #4caf50; opacity: 0.7; pointer-events: none; }
        .task-done .btn-group { display: none; }
        .task-done-msg { color: #4caf50; font-weight: bold; font-size: 14px; text-align: center; display: block; margin-top: 10px; }
        .fab-btn { position: fixed; bottom: 30px; right: 30px; background: #00d2b4; color: #1a2c35; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: none; cursor: pointer; z-index: 1000; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 28px; cursor: pointer; color: #555; line-height: 1; }
    </style>
</head>
<body>

    <datalist id="listaTodasTarefas"></datalist>

    <div id="screenLogin" class="screen active">
        <div style="text-align: center; margin-bottom: 25px;">
            <img src="Logo-Condocheck.png" class="logo-condocheck" alt="CondoCheck">
            <p style="color: #555; font-size: 14px; margin-top: 10px; font-weight: bold;">Acesso Operacional Restrito - V2</p>
        </div>
        
        <label>Usuário:</label>
        <input type="text" id="loginUser" placeholder="Ex: maria">
        
        <label>Senha:</label>
        <input type="password" id="loginPass" placeholder="****">

        <button class="btn-main" id="btnEntrarLogin" onclick="fazerLogin()">ENTRAR</button>
        <p id="msgLogin" class="error"></p>
    </div>

    <div id="screenChecklist" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center">
            <img src="logo-arca.png" style="height: 25px; width: auto;" alt="Arca">
            <h3 style="margin:0; color:#1a2c35; flex-grow: 1;">CONDOCHECK</h3>
            <small onclick="sair()" style="color:red; cursor:pointer; font-weight:bold;">Sair</small>
        </div>
        <hr style="border:0; border-top:1px solid #eee; margin:10px 0">

        <div style="background:#e9ecef; padding:10px; border-radius:6px; margin-bottom:15px; text-align:center;">
            <span style="color:#555; font-weight:bold" id="userNameDisplay"></span><br>
            <span style="color:#888; font-size:14px" id="dateDisplay"></span>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p id="progressText" style="text-align:center; font-size:14px; margin-top:5px; color:#555; font-weight:bold;"></p>

        <div id="tasksContainer"></div>
        <p id="statusMsg" style="text-align:center; margin-top:15px; font-weight:bold; color: #00d2b4;"></p>
        <button class="fab-btn" onclick="abrirModalOcorrencia()">🔧</button>
    </div>

    <!-- MODAL DE OCORRÊNCIAS AVULSAS -->
    <div id="modalOcorrencia" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="fecharModalOcorrencia()">&times;</span>
            <h3>Registrar Ocorrência Avulsa</h3>
            
            <label>Selecione a Tarefa/Atividade:</label>
            <input type="text" id="ocorrencaTarefaInput" list="listaTodasTarefas" placeholder="Digite ou selecione a atividade...">
            
            <label>Descrição Detalhada do Problema:</label>
            <textarea id="ocorrenciaDescricao" rows="4" placeholder="Relate o que aconteceu ou o que precisa de manutenção..."></textarea>
            
            <button class="btn-main" id="btnEnviarOcorrenciaAvulsa" onclick="salvarOcorrenciaAvulsa()">REGISTRAR OCORRÊNCIA</button>
            <p id="msgOcorrenciaModal" style="text-align:center; font-weight:bold; margin-top:10px;"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://arca-bento-condocheck-supabase.wsoxvx.easypanel.host';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE';

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let loggedUser = null;
        let diaAtual = '';
        let totalTarefas = 0;
        let tarefasConcluidas = 0;
        let listaIdsTarefasCarregadas = [];

        const diasSemana = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
        const hoje = new Date();
        diaAtual = diasSemana[hoje.getDay()];

        function init() {
            const savedUserId = localStorage.getItem('condocheck_v2_user_id');
            const savedUserName = localStorage.getItem('condocheck_v2_user_name');
            if (savedUserId && savedUserName) {
                loggedUser = { id: savedUserId, nome: savedUserName };
                mostrarTelaTarefas();
            }
            carregarTodasTarefasParaDatalist();
        }
        window.onload = init;

        async function fazerLogin() {
            const login = document.getElementById('loginUser').value.toLowerCase().trim();
            const senha = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('msgLogin');
            const btn = document.getElementById('btnEntrarLogin');

            if(!login || !senha) { msg.innerText = "Preencha tudo."; return; }

            msg.innerText = "Verificando...";
            btn.disabled = true;

            try {
                const { data, error } = await sb
                    .from('funcionarios_v2')
                    .select('*')
                    .eq('login', login)
                    .eq('senha', senha)
                    .maybeSingle();

                if(error) {
                    msg.innerText = "Erro de resposta do banco de dados.";
                    btn.disabled = false;
                    return;
                }

                if(!data) {
                    msg.innerText = "Usuário ou senha incorretos.";
                    btn.disabled = false;
                } else {
                    msg.innerText = "";
                    loggedUser = data;
                    localStorage.setItem('condocheck_v2_user_id', data.id);
                    localStorage.setItem('condocheck_v2_user_name', data.nome);
                    mostrarTelaTarefas();
                }
            } catch(e) {
                msg.innerText = "Falha de conexão com o banco.";
                btn.disabled = false;
            }
        }

        function sair() {
            localStorage.removeItem('condocheck_v2_user_id');
            localStorage.removeItem('condocheck_v2_user_name');
            location.reload();
        }

        function mostrarTelaTarefas() {
            document.getElementById('screenLogin').classList.remove('active');
            document.getElementById('screenChecklist').classList.add('active');
            document.getElementById('userNameDisplay').innerText = `Olá, ${loggedUser.nome}`;
            document.getElementById('dateDisplay').innerText = `Tarefas de Hoje (${diaAtual.charAt(0).toUpperCase() + diaAtual.slice(1)})`;
            carregarTarefas();
        }

        function atualizarProgresso() {
            const progressText = document.getElementById('progressText');
            const progressBar = document.getElementById('progressBar');
            if(totalTarefas === 0) {
                progressText.innerText = '';
                progressBar.style.width = '0%';
                return;
            }
            const perc = (tarefasConcluidas / totalTarefas) * 100;
            progressBar.style.width = `${perc}%`;
            progressText.innerText = `${tarefasConcluidas} de ${totalTarefas} Tarefas Concluídas`;
        }

        async function carregarTarefas() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = 'Carregando atividades...';
            totalTarefas = 0;
            tarefasConcluidas = 0;
            listaIdsTarefasCarregadas = [];
            
            if(diaAtual === 'domingo') {
                container.innerHTML = '<p style="text-align:center; color:#555; font-weight:bold; margin-top:20px;">Nenhuma tarefa programada para domingo.</p>';
                atualizarProgresso();
                return;
            }

            try {
                const { data: tarefas, error: errT } = await sb
                    .from('matriz_tarefas_v2')
                    .select('*')
                    .eq('funcionario_id', loggedUser.id)
                    .eq(diaAtual, true);

                if(errT) throw errT;

                if(!tarefas || tarefas.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#555; margin-top:20px;">Nenhuma tarefa programada para você hoje.</p>';
                    atualizarProgresso();
                    return;
                }

                totalTarefas = tarefas.length;
                listaIdsTarefasCarregadas = tarefas.map(t => String(t.id));

                const hojeString = hoje.toISOString().split('T')[0];
                const { data: executadas, error: errE } = await sb
                    .from('diario_execucoes_v2')
                    .select('tarefa_id, status')
                    .eq('funcionario_id', loggedUser.id)
                    .eq('data_execucao', hojeString);

                if(errE) throw errE;

                const mapaExecutadas = {};
                if(executadas) {
                    executadas.forEach(e => { mapaExecutadas[String(e.tarefa_id)] = e.status; });
                }

                container.innerHTML = '';
                tarefas.forEach(t => {
                    const tIdStr = String(t.id);
                    const jaConcluida = mapaExecutadas[tIdStr];

                    const card = document.createElement('div');
                    card.id = `card-${tIdStr}`;
                    card.className = `task-card ${jaConcluida ? 'task-done' : ''}`;
                    
                    let htmlInterno = `<div class="task-title">${t.descricao_tarefa}</div>`;
                    
                    if(jaConcluida) {
                        tarefasConcluidas++;
                        htmlInterno += `<span class="task-done-msg">✓ ${jaConcluida}</span>`;
                    } else {
                        htmlInterno += `
                            <div class="btn-group" id="actions-${tIdStr}">
                                <button class="btn-executar" onclick="abrirExecucao('${tIdStr}')">Concluir</button>
                                <button class="btn-justificar" onclick="abrirJustificativa('${tIdStr}')">Justificar</button>
                            </div>
                            <div class="execucao-box" id="box-exec-${tIdStr}">
                                <label>Evidência/Foto Link (Opcional):</label>
                                <input type="text" id="foto-${tIdStr}" placeholder="http://...">
                                <button class="btn-send-exec" onclick="enviarExecucao('${tIdStr}', 'CONCLUIDO')">CONFIRMAR CONCLUSÃO</button>
                            </div>
                            <div class="justificativa-box" id="box-just-${tIdStr}">
                                <label>Motivo da Justificativa:</label>
                                <select id="motivo-${tIdStr}">
                                    <option value="Chuva">Chuva / Tempo Ruim</option>
                                    <option value="Falta de Material">Falta de Material</option>
                                    <option value="Equipamento Quebrado">Equipamento Quebrado</option>
                                    <option value="Outros">Outros (Descrever abaixo)</option>
                                </select>
                                <label>Detalhes:</label>
                                <textarea id="detalhe-just-${tIdStr}" rows="2" placeholder="Explique o motivo..."></textarea>
                                <button class="btn-send-just" onclick="enviarExecucao('${tIdStr}', 'JUSTIFICADO')">GRAVAR JUSTIFICATIVA</button>
                            </div>
                        `;
                    }
                    
                    card.innerHTML = htmlInterno;
                    container.appendChild(card);
                });

            } catch(e) {
                container.innerHTML = '<p style="text-align:center; color:red; margin-top:20px;">Erro ao carregar o checklist de hoje.</p>';
            }
            atualizarProgresso();
        }

        function abrirExecucao(id) {
            document.getElementById(`box-just-${id}`).classList.remove('open');
            document.getElementById(`box-exec-${id}`).classList.toggle('open');
        }

        function abrirJustificativa(id) {
            document.getElementById(`box-exec-${id}`).classList.remove('open');
            document.getElementById(`box-just-${id}`).classList.toggle('open');
        }

        async function enviarExecucao(tarefaId, statusAlvo) {
            const hojeString = hoje.toISOString().split('T')[0];
            let fotoUrl = null;
            let motivoEscolhido = null;

            if(statusAlvo === 'CONCLUIDO') {
                fotoUrl = document.getElementById(`foto-${tarefaId}`).value.trim() || null;
            } else {
                const sel = document.getElementById(`motivo-${tarefaId}`).value;
                const det = document.getElementById(`detalhe-just-${tarefaId}`).value.trim();
                motivoEscolhido = det ? `${sel} - ${det}` : sel;
            }

            const novoIdUuid = crypto.randomUUID();

            try {
                const { error } = await sb
                    .from('diario_execucoes_v2')
                    .insert([{
                        id: novoIdUuid, 
                        tarefa_id: tarefaId,
                        funcionario_id: loggedUser.id,
                        data_execucao: hojeString,
                        status: statusAlvo,
                        motivo: motivoEscolhido,
                        foto_evidencia: fotoUrl
                    }]);

                if(error) {
                    alert('Erro ao gravar no banco: ' + error.message);
                    return;
                }

                const card = document.getElementById(`card-${tarefaId}`);
                card.className = 'task-card task-done';
                card.innerHTML = `
                    <div class="task-title">${card.querySelector('.task-title').innerText}</div>
                    <span class="task-done-msg">✓ ${statusAlvo}</span>
                `;
                
                tarefasConcluidas++;
                atualizarProgresso();

            } catch(e) {
                alert('Falha crítica na execução do comando.');
            }
        }

        async function carregarTodasTarefasParaDatalist() {
            try {
                // CORREÇÃO DA FONTE PRIMÁRIA: APONTANDO PARA A TABELA DE MATRIZ DE TAREFAS ATIVA
                const { data } = await sb.from('matriz_tarefas_v2').select('id, descricao_tarefa');
                if(data) {
                    const dl = document.getElementById('listaTodasTarefas');
                    dl.innerHTML = '';
                    data.forEach(x => {
                        const opt = document.createElement('option');
                        opt.value = x.descricao_tarefa;
                        opt.setAttribute('data-id', x.id);
                        dl.appendChild(opt);
                    });
                }
            } catch(e){}
        }

        function abrirModalOcorrencia() { document.getElementById('modalOcorrencia').style.display = 'flex'; }
        function fecharModalOcorrencia() { document.getElementById('modalOcorrencia').style.display = 'none'; }

        async function salvarOcorrenciaAvulsa() {
            const txtTarefa = document.getElementById('ocorrencaTarefaInput').value.trim();
            const desc = document.getElementById('ocorrenciaDescricao').value.trim();
            const msg = document.getElementById('msgOcorrenciaModal');

            if(!txtTarefa || !desc) { msg.style.color = 'red'; msg.innerText = "Preencha todos os campos."; return; }

            msg.style.color = '#1a2c35';
            msg.innerText = "Gravando ocorrência...";

            try {
                const { error } = await sb
                    .from('ocorrencias')
                    .insert([{
                        id: crypto.randomUUID(),
                        descricao: `Atividade: ${txtTarefa} | Relato: ${desc}`,
                        funcionario_id: loggedUser.id,
                        data_registro: new Date().toISOString()
                    }]);

                if(error) { msg.style.color = 'red'; msg.innerText = error.message; }
                else {
                    msg.style.color = 'green';
                    msg.innerText = "Ocorrência registrada com sucesso!";
                    setTimeout(() => {
                        fecharModalOcorrencia();
                        document.getElementById('ocorrencaTarefaInput').value = '';
                        document.getElementById('ocorrenciaDescricao').value = '';
                        msg.innerText = '';
                    }, 1500);
                }
            } catch(e) { msg.style.color = 'red'; msg.innerText = "Falha de conexão."; }
        }
    </script>
</body>
</html>
